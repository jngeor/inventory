# Build de los servicios: mvn verify por cada módulo que cambió (testing.md 9).
#
# Corre en cada PR a main y en cada push a feature/**, sin filtro de rutas.
# El check obligatorio del ruleset es solo el job final "build": su nombre
# es fijo aunque la matriz cambie, y pasa si no hubo módulos que construir.
name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/**"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: módulos cambiados
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # En un PR se compara con su base; en un push, con el punto donde la
      # rama salió de main, para cubrir todo lo que trae la rama.
      - name: Detectar módulos
        id: detect
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base=$PR_BASE
          else
            base=$(git merge-base origin/main HEAD)
          fi
          if [ ! -f pom.xml ]; then
            echo "::notice::No hay pom.xml en la raíz: no hay módulos que construir"
          fi
          modules=$(.github/scripts/changed-modules.sh "$base")
          echo "Módulos a construir: $modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  verify:
    name: verify (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Docker ya está en el runner: Testcontainers corre sin configuración.
      - name: mvn verify
        run: |
          if [ -x mvnw ]; then mvn=./mvnw; else mvn=mvn; fi
          $mvn -B -ntp -pl "${{ matrix.module }}" verify

      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/target/surefire-reports/
            ${{ matrix.module }}/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        env:
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          MODULES: ${{ needs.changes.outputs.modules }}
        run: |
          echo "módulos cambiados: $CHANGES, verify: $VERIFY, módulos: $MODULES"
          if [ "$CHANGES" != success ]; then
            echo "::error::No se pudo detectar qué módulos cambiaron"
            exit 1
          fi
          case "$VERIFY" in
            success) ;;
            skipped) echo "::notice::Ningún módulo cambió: no hubo nada que construir" ;;
            *) echo "::error::mvn verify falló en algún módulo"; exit 1 ;;
          esac
